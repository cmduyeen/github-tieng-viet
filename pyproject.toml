[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-tieng-viet"
version = "0.1.0"
description = "GitHub CLI (gh) Viet hoa cho nguoi moi hoc va tre em"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dyn" }
]
dependencies = []
keywords = ["github", "gh", "vietnamese", "github-tieng-viet", "vgh", "cli", "beginner"]

[project.urls]
Homepage = "https://github.com/cmduyeen/github-tieng-viet"
Repository = "https://github.com/cmduyeen/github-tieng-viet"
Issues = "https://github.com/cmduyeen/github-tieng-viet/issues"
Funding = "https://ko-fi.com/cmduyeen"

[project.scripts]
vgh = "vgh.cli:main"

[tool.setuptools.packages.find]
include = ["vgh*"]
